<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lock Reader</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Lock Reader</h1>
<form id="settings">
<label>Lock-only upload key<input id="key" type="password" autocomplete="off"></label>
<label>Test property ID<input id="listing" value="68db1a47ccc0790022ab80c6" required pattern="[a-f0-9]{24}"></label>
<label class="toggle"><input id="enabled" type="checkbox"> Collect and refresh every 15 minutes</label>
<button type="submit">Save</button><button id="refresh" type="button">Refresh now</button>
</form><p id="status" role="status"></p><p id="last"></p><script src="popup.js"></script></body></html>
